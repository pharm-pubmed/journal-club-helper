name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test -- --coverage

      - name: Build
        run: pnpm build

      - name: Manifest permission guard
        run: pnpm check:manifest

      - name: Zip
        run: pnpm zip

      - uses: actions/upload-artifact@v7
        with:
          name: chrome-mv3-zip
          path: .output/*.zip
          retention-days: 14
          # .output is a dot directory, and upload-artifact skips hidden paths by
          # default: without this the job stays green while uploading nothing.
          include-hidden-files: true
          # A missing zip means the release artifact is missing. Fail, don't warn.
          if-no-files-found: error
