name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test -- --coverage

      - name: Build
        run: pnpm build

      - name: Manifest permission guard
        run: pnpm check:manifest

      - name: Zip
        run: pnpm zip

      - uses: actions/upload-artifact@v4
        with:
          name: chrome-mv3-zip
          path: .output/*.zip
          retention-days: 14
